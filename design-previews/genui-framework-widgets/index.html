<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speak GenUI Framework Widgets</title>
    <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-soft: #f0f2f4;
      --surface-strong: #e8ecef;
      --text: #15171a;
      --muted: #697179;
      --subtle: #8b949d;
      --border: #d9dee3;
      --border-strong: #c5ccd3;
      --accent: #177245;
      --accent-soft: #e7f3ed;
      --danger: #b42318;
      --danger-soft: #fff0ef;
      --focus: #1a73e8;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      --font: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      font-family: var(--font);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: var(--border-strong);
      background: #fbfcfd;
    }

    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.05;
      font-weight: 540;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 880px;
      color: var(--muted);
      font-size: 15px;
    }

    .global-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .segmented {
      display: inline-flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .segmented button {
      min-height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 11px;
    }

    .segmented button.is-active {
      background: var(--text);
      color: #fff;
    }

    .notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
    }

    .notice strong {
      color: var(--text);
      font-weight: 530;
    }

    .framework-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .framework-card {
      min-width: 0;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .host-bar {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff, #f8fafb);
    }

    .host-title {
      min-width: 0;
    }

    .host-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 540;
    }

    .host-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .host-tag {
      padding: 5px 8px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .host-body {
      min-width: 0;
      max-width: 100%;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 560px;
    }

    .adapter-rail {
      border-right: 1px solid var(--border);
      background: #fbfcfd;
      padding: 12px;
      min-width: 0;
    }

    .rail-label {
      margin: 0 0 8px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 540;
      text-transform: uppercase;
    }

    .rail-item {
      display: grid;
      gap: 2px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
    }

    .rail-item:first-of-type {
      border-top: 0;
    }

    .rail-item b {
      font-size: 12px;
      font-weight: 530;
    }

    .rail-item span {
      color: var(--muted);
      font-size: 12px;
    }

    .rail-code {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #f3f5f7;
      color: #4c5560;
      font-family: var(--font);
      font-size: 11px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .widget {
      min-width: 0;
      max-width: 100%;
      min-height: 560px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .widget-route {
      min-width: 0;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .route-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-width: 0;
      max-width: 100%;
    }

    .route-tabs button {
      min-width: 0;
      min-height: 30px;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0 9px;
    }

    .route-tabs button.is-active {
      background: var(--surface-soft);
      color: var(--text);
    }

    .widget-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
    }

    .icon-button {
      width: auto;
      min-width: 32px;
      min-height: 32px;
      padding: 0 8px;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
    }

    .context-strip {
      min-width: 0;
      max-width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
      gap: 1px;
      border-bottom: 1px solid var(--border);
      background: var(--border);
    }

    .context-cell {
      min-width: 0;
      padding: 10px 12px;
      background: #fbfcfd;
    }

    .context-cell label {
      display: block;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 540;
      text-transform: uppercase;
    }

    .context-cell strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 540;
    }

    .context-cell span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .context-action {
      min-width: 132px;
      padding: 10px 12px;
      background: #fbfcfd;
      display: grid;
      place-items: center;
    }

    .primary-action {
      width: 100%;
      min-height: 38px;
      border-color: var(--text);
      background: var(--text);
      color: #fff;
      font-weight: 540;
    }

    .primary-action.is-danger {
      border-color: var(--danger);
      background: var(--danger);
    }

    .widget-main {
      min-height: 0;
      min-width: 0;
      max-width: 100%;
      display: grid;
      grid-template-columns: minmax(160px, 32%) minmax(0, 1fr);
    }

    .left-pane {
      min-width: 0;
      border-right: 1px solid var(--border);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .pane-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
    }

    .pane-head strong {
      font-size: 13px;
      font-weight: 540;
    }

    .pane-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .list {
      min-height: 0;
      overflow: auto;
    }

    .row {
      display: grid;
      grid-template-columns: 8px minmax(0, 1fr);
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }

    .row.is-selected {
      background: var(--accent-soft);
    }

    .pin {
      width: 8px;
      height: 32px;
      border-radius: 999px;
      background: var(--surface-strong);
    }

    .row.is-selected .pin {
      background: var(--accent);
    }

    .row strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 540;
    }

    .row span,
    .row small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
    }

    .content-pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .transcript-head {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
    }

    .transcript-head strong {
      display: block;
      font-size: 13px;
      font-weight: 540;
    }

    .transcript-head span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .call-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .call-actions button {
      min-height: 32px;
      padding: 0 10px;
    }

    .transcript {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      align-content: end;
      gap: 10px;
      background: #fafbfc;
    }

    .turn {
      max-width: 88%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
    }

    .turn.agent {
      justify-self: start;
    }

    .turn.contact,
    .turn.operator {
      justify-self: end;
      background: #eef5ff;
      border-color: #d3e4ff;
    }

    .turn b {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 540;
    }

    .turn p {
      margin: 0;
      font-size: 13px;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: #fff;
    }

    .composer input {
      min-width: 0;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0 11px;
      color: var(--text);
    }

    .proof {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: #fbfcfd;
      color: var(--muted);
      font-size: 12px;
    }

    .proof span {
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
    }

    .settings-drawer {
      display: none;
      border-top: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
    }

    .settings-drawer.is-open {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .setting {
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fbfcfd;
    }

    .setting label {
      display: block;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 540;
      text-transform: uppercase;
    }

    .setting strong {
      display: block;
      margin-top: 2px;
      font-size: 12px;
    }

    .table {
      min-width: 0;
      overflow: auto;
    }

    .table-row {
      display: grid;
      grid-template-columns: minmax(130px, 1.2fr) minmax(90px, 0.8fr) minmax(90px, 0.8fr);
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .table-row.header {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 540;
      text-transform: uppercase;
      background: #fbfcfd;
    }

    .status {
      width: fit-content;
      max-width: 100%;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
    }

    .status.ready {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .json-panel {
      min-height: 0;
      overflow: auto;
      padding: 12px;
      background: #fbfcfd;
      border-left: 1px solid var(--border);
      color: #4b5563;
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .framework-card[data-framework="agui"] .host-bar {
      background: linear-gradient(180deg, #ffffff, #f7fbf8);
    }

    .framework-card[data-framework="a2ui"] .host-bar {
      background: linear-gradient(180deg, #ffffff, #f8fbff);
    }

    .framework-card[data-framework="copilot"] .host-body {
      grid-template-columns: 220px minmax(0, 1fr);
    }

    @media (max-width: 1100px) {
      .framework-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: 100%;
        padding: 0;
      }

      .top,
      .notice,
      .host-bar,
      .host-body,
      .widget-main,
      .context-strip,
      .settings-drawer.is-open {
        grid-template-columns: 1fr;
      }

      .framework-card,
      .host-body,
      .widget,
      .widget-route,
      .context-strip,
      .widget-main,
      .left-pane,
      .content-pane {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .widget {
        min-height: 0;
      }

      .global-controls {
        justify-content: flex-start;
      }

      .adapter-rail {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .host-body {
        min-height: auto;
      }

      .context-action {
        min-width: 0;
      }

      .widget-main {
        min-height: 660px;
      }

      .left-pane {
        min-height: 210px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .content-pane {
        min-height: 430px;
      }

      .transcript-head,
      .widget-route {
        align-items: flex-start;
        flex-direction: column;
      }

      .call-actions,
      .widget-tools {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="framework-grid" class="framework-grid" aria-label="Speak generative UI widget preview"></section>
  </main>

  <script>
    const previewHost = {
      id: "speak-widget-preview",
      title: "Speak GenUI widget"
    };

    const data = {
      selectedContact: {
        business: "Horizon Dental",
        contact: "Mia Alvarez",
        phone: "(555) 014-2218",
        status: "Ready",
        last: "Last attempt: no answer, 2 days ago"
      },
      smartView: {
        name: "Ready contacts - June follow-up",
        count: 42,
        ready: 31
      },
      profile: {
        name: "Customer Follow Up",
        voice: "Voice runtime v3",
        tools: "SMS, email, contact update, context lookup"
      },
      contacts: [
        ["Horizon Dental", "Mia Alvarez", "Ready", "No answer, 2 days ago"],
        ["Northline Robotics", "Theo Park", "Follow up", "Asked for callback"],
        ["Orchard Market", "Nina Shah", "Ready", "New import"],
        ["Keystone Fitness", "Owen Reyes", "Ready", "Workspace link sent"]
      ],
      activity: [
        ["agent", "Customer Follow Up", "Hi Mia, this is the Speak agent calling about your onboarding workflow. Are you the right person to speak with?"],
        ["contact", "Mia Alvarez", "Yes, I can talk for a minute. What is this regarding?"],
        ["agent", "Customer Follow Up", "I am following up on the onboarding details and can send the workspace link after confirming the best phone and email."]
      ],
      tests: [
        ["operator", "Test contact", "I missed your call. Can you explain what you need from me?"],
        ["agent", "Customer Follow Up", "Yes. I am confirming your business details and can send a secure workspace link once the destination is confirmed."]
      ]
    };

    let surface = "dialer";
    let callActive = false;
    let settingsOpen = false;

    const grid = document.getElementById("framework-grid");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function render() {
      grid.innerHTML = renderWidget(previewHost);
      grid.querySelectorAll("[data-route]").forEach((button) => {
        button.addEventListener("click", () => {
          surface = button.dataset.route;
          render();
        });
      });
      grid.querySelectorAll("[data-preview-settings]").forEach((button) => {
        button.addEventListener("click", () => {
          settingsOpen = !settingsOpen;
          render();
        });
      });
      grid.querySelectorAll("[data-local-call]").forEach((button) => {
        button.addEventListener("click", () => {
          callActive = !callActive;
          render();
        });
      });
    }

    function renderWidget(framework) {
      const context = getContext();
      const actionLabel = getPrimaryActionLabel();
      const isDanger = callActive && surface !== "library";
      return `
        <section class="widget" aria-label="Speak ${escapeHtml(surface)} widget">
          <div class="widget-route">
            <div class="route-tabs" aria-label="Routes">
              ${["library", "dialer", "playground"].map((item) => `
                <button type="button" data-route="${escapeHtml(routeToSurface(item))}" class="${routeToSurface(item) === surface ? "is-active" : ""}">${escapeHtml(item === "playground" ? "Playground" : titleCase(item))}</button>
              `).join("")}
            </div>
            <div class="widget-tools">
              <button class="icon-button" type="button" aria-label="Search">Search</button>
              <button class="icon-button" type="button" aria-label="Appearance">Theme</button>
              <button data-preview-settings type="button">Settings</button>
            </div>
          </div>
          <div class="context-strip">
            ${context.map((item) => `
              <div class="context-cell">
                <label>${escapeHtml(item.label)}</label>
                <strong>${escapeHtml(item.title)}</strong>
                <span>${escapeHtml(item.detail)}</span>
              </div>
            `).join("")}
            <div class="context-action">
              <button data-local-call class="primary-action ${isDanger ? "is-danger" : ""}" type="button">${escapeHtml(actionLabel)}</button>
            </div>
          </div>
          ${settingsDrawer()}
          ${surface === "library" ? renderLibrary(framework) : surface === "playground" ? renderPlayground(framework) : renderDialer(framework)}
        </section>
      `;
    }

    function renderDialer(framework) {
      return `
        <div class="widget-main">
          <aside class="left-pane">
            <div class="pane-head"><strong>Queue</strong><span>${data.smartView.ready} ready</span></div>
            <div class="list">
              ${data.contacts.map((contact, index) => itemRow(contact, index === 0)).join("")}
            </div>
          </aside>
          <section class="content-pane">
            <header class="transcript-head">
              <div>
                <strong>${callActive ? "Live call" : "Selected transcript"}</strong>
                <span>${data.selectedContact.business} - ${data.selectedContact.contact}</span>
              </div>
              <div class="call-actions">
                <button type="button">${callActive ? "Takeover" : "Device call"}</button>
                <button type="button">${callActive ? "Next" : "History"}</button>
              </div>
            </header>
            <div class="transcript">
              ${data.activity.map(renderTurn).join("")}
              ${callActive ? renderTurn(["contact", data.selectedContact.contact, "I can confirm the number. Please send it to this phone."]) : ""}
            </div>
            <div class="proof">
              <span>${callActive ? "callControlId: preview-active" : "No active call"}</span>
              <span>Proof required before success claims</span>
              <span>Preview data</span>
            </div>
          </section>
        </div>
      `;
    }

    function renderPlayground(framework) {
      return `
        <div class="widget-main">
          <aside class="left-pane">
            <div class="pane-head"><strong>Profile</strong><span>Saved config</span></div>
            <div class="list">
              ${itemRow(["Customer Follow Up", "Primary profile", "Active", "Smart View assigned"], true)}
              ${itemRow(["Prompt", "Profile instructions", "Saved", "Used by next test"], false)}
              ${itemRow(["Smart Config", "Owner-only mode", "Available", "Scoped to selected profile"], false)}
            </div>
          </aside>
          <section class="content-pane">
            <header class="transcript-head">
              <div>
                <strong>${callActive ? "Browser test running" : "Playground transcript"}</strong>
                <span>Contact context: ${data.selectedContact.contact} at ${data.selectedContact.business}</span>
              </div>
              <div class="call-actions">
                <button type="button">Speak</button>
                <button type="button">Prompt</button>
                <button type="button">Smart Config</button>
              </div>
            </header>
            <div class="transcript">
              ${data.tests.map(renderTurn).join("")}
              ${callActive ? renderTurn(["agent", data.profile.name, "Preview session is active. The next contact message will use the saved profile and selected test contact."]) : ""}
            </div>
            <div class="composer">
              <input value="Type a simulated contact message" aria-label="Playground message">
              <button type="button">Send</button>
            </div>
            <div class="proof">
              <span>Browser test only unless Phone is explicitly chosen</span>
              <span>Profile sync proof required</span>
              <span>Preview data</span>
            </div>
          </section>
        </div>
      `;
    }

    function renderLibrary(framework) {
      return `
        <div class="widget-main">
          <aside class="left-pane">
            <div class="pane-head"><strong>Sources</strong><span>3 modes</span></div>
            <div class="list">
              ${itemRow(["Contacts", data.smartView.name, "Selected", "Editable records"], true)}
              ${itemRow(["Agents", "Profile reconciliation", "Index", "Calls and Smart Views"], false)}
              ${itemRow(["Activity", "Phone and Playground", "Review", "Recording and emotion coverage"], false)}
            </div>
          </aside>
          <section class="content-pane">
            <header class="transcript-head">
              <div>
                <strong>Contact records</strong>
                <span>Bulk controls stay hidden until rows are selected</span>
              </div>
              <div class="call-actions">
                <button type="button">Add</button>
                <button type="button">Import</button>
                <button type="button">Sync</button>
              </div>
            </header>
            <div class="table">
              <div class="table-row header"><span>Business</span><span>Status</span><span>Last call</span></div>
              ${data.contacts.map((contact, index) => `
                <div class="table-row ${index === 0 ? "is-selected" : ""}">
                  <strong>${escapeHtml(contact[0])}</strong>
                  <span class="status ${contact[2] === "Ready" ? "ready" : ""}">${escapeHtml(contact[2])}</span>
                  <span>${escapeHtml(contact[3])}</span>
                </div>
              `).join("")}
            </div>
            <div class="proof">
              <span>Workspace persistence required</span>
              <span>Delete/import/sync require backend proof</span>
              <span>Preview data</span>
            </div>
          </section>
        </div>
      `;
    }

    function settingsDrawer() {
      return `
        <div class="settings-drawer ${settingsOpen ? "is-open" : ""}">
          <div class="setting"><label>Agent config</label><strong>${data.profile.name}</strong></div>
          <div class="setting"><label>Voice/runtime</label><strong>${data.profile.voice}</strong></div>
          <div class="setting"><label>Tools</label><strong>${data.profile.tools}</strong></div>
        </div>
      `;
    }

    function getContext() {
      if (surface === "library") {
        return [
          { label: "Source", title: data.smartView.name, detail: `${data.smartView.count} contacts in current view` },
          { label: "Mode", title: "Contacts", detail: "Records, Smart Views, imports, Activity review" },
          { label: "Agent link", title: data.profile.name, detail: "Assigned to follow-up workflow" }
        ];
      }
      if (surface === "playground") {
        return [
          { label: "Test contact", title: `${data.selectedContact.contact}`, detail: `${data.selectedContact.business} - ${data.selectedContact.phone}` },
          { label: "Agent config", title: data.profile.name, detail: data.profile.voice },
          { label: "Mode", title: callActive ? "Browser test running" : "Ready to test", detail: "Phone test requires explicit choice" }
        ];
      }
      return [
        { label: "Calling", title: `${data.selectedContact.business}`, detail: `${data.selectedContact.contact} - ${data.selectedContact.phone}` },
        { label: "Smart list", title: data.smartView.name, detail: `${data.smartView.ready} ready of ${data.smartView.count}` },
        { label: "Agent config", title: data.profile.name, detail: data.profile.voice }
      ];
    }

    function getPrimaryActionLabel() {
      if (surface === "library") return "Open";
      if (surface === "playground") return callActive ? "Stop test" : "Start test";
      return callActive ? "End call" : "Call";
    }

    function itemRow(item, selected) {
      return `
        <div class="row ${selected ? "is-selected" : ""}">
          <span class="pin"></span>
          <div>
            <strong>${escapeHtml(item[0])}</strong>
            <span>${escapeHtml(item[1])}</span>
            <small>${escapeHtml(item[2])} - ${escapeHtml(item[3])}</small>
          </div>
        </div>
      `;
    }

    function renderTurn(turn) {
      return `
        <div class="turn ${escapeHtml(turn[0])}">
          <b>${escapeHtml(turn[1])}</b>
          <p>${escapeHtml(turn[2])}</p>
        </div>
      `;
    }

    function routeToSurface(route) {
      return route === "playground" ? "playground" : route;
    }

    function titleCase(value) {
      return value.slice(0, 1).toUpperCase() + value.slice(1);
    }

    render();
  </script>
</body>
</html>
