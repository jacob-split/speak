<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speak CallTools Gateway</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #17171b;
        color: #f4f4f5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        display: grid;
        gap: 14px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 560;
      }

      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.45;
      }

      #status {
        padding: 14px 16px;
        border: 1px solid #34343a;
        border-radius: 8px;
        background: #1f1f24;
        color: #f4f4f5;
      }

      #log {
        max-height: 260px;
        overflow: auto;
        padding: 12px;
        border: 1px solid #34343a;
        border-radius: 8px;
        background: #111114;
        color: #d4d4d8;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Speak CallTools Gateway</h1>
      <p>Registered CallTools phone endpoint for Speak voice agents.</p>
      <div id="status">Starting...</div>
      <div id="log" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/calltoolsGateway.ts"></script>
  </body>
</html>
